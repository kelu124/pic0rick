# pic0rick Python library version.
#
# Format: A.B.C  (major.minor.patch)  -- mirrors the firmware scheme.
#   A (major)  0-99   -- managed by the maintainer (Luc)
#   B (minor)  0-99   -- managed by the maintainer (Luc)
#   C (patch)  0-999  -- bumped by Claude on every change to python/ files
#
# `changes` is a short, single-line, double-quoted summary of what changed vs
# the previous version. Exposed as pic0rick.__changes__.
version: "0.1.2"
changes: "Add DSP-build host support: pic0rick.dsp (binary frame protocol reader, CRC, status parser, A-law decode; length-agnostic for read_raw 8000 / read_fft 4096) and Pic0rick.status()/capture()/read_fft()/read_raw()."
