name: firmware

# Build every firmware variant on pushes and PRs to main. On pushes to main
# (i.e. merged code), publish a GitHub release with all variants attached.
# Branches other than main never create a release.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write  # required to create releases / tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need tags to detect an already-released version

      - name: Install ARM GCC toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake

      - name: Checkout pico-sdk
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: '2.3.0'
          path: pico-sdk
          submodules: recursive

      # The DSP builds fetch CMSIS-DSP v1.17.0 via FetchContent into
      # firmware/.deps (shared by build.sh). Cache it to avoid re-cloning.
      - name: Cache CMSIS-DSP
        uses: actions/cache@v4
        with:
          path: firmware/.deps
          key: cmsis-dsp-v1.17.0

      - name: Build all firmware variants
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
        run: |
          cd firmware
          ./build.sh

      - name: Read versions
        id: fw
        run: |
          read_yaml() {  # $1 = yaml path, $2 = key
            grep -E "^$2:" "$1" | sed -E "s/$2:[[:space:]]*\"?(.*[^\"])\"?[[:space:]]*$/\1/"
          }
          fw_v=$(read_yaml firmware/version.yaml version)
          fw_c=$(read_yaml firmware/version.yaml changes)
          py_v=$(read_yaml python/pic0rick/version.yaml version)
          py_c=$(read_yaml python/pic0rick/version.yaml changes)
          echo "version=$fw_v" >> "$GITHUB_OUTPUT"
          echo "Firmware v$fw_v / Python v$py_v"
          # Compose the release body (firmware + python) into a file.
          {
            echo "**firmware v$fw_v · python library v$py_v**"
            echo ""
            echo "### Firmware changes"
            echo "$fw_c"
            echo ""
            echo "### Python library changes"
            echo "$py_c"
            echo ""
            echo "Artifacts: rp2040/rp2350 × mux/nomux \`.uf2\`."
          } > release_body.md
          cat release_body.md

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pic0rick-firmware-v${{ steps.fw.outputs.version }}
          path: firmware/dist/*.uf2
          if-no-files-found: error

      # ---- Release (push to main only) ----
      - name: Check if release tag already exists
        id: tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git rev-parse -q --verify "refs/tags/fw-v${{ steps.fw.outputs.version }}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag fw-v${{ steps.fw.outputs.version }} already exists; skipping release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fw-v${{ steps.fw.outputs.version }}
          name: firmware v${{ steps.fw.outputs.version }}
          body_path: release_body.md
          files: firmware/dist/*.uf2
